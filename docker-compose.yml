services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5572:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    env_file:
      - .env

  app:
    build:
      context: .
      args:
        - DEMO_MODE
        - PUBLIC_DATA_DONATION_ENABLED
        - DEMO_SHOW_HAS_TOKEN_BUTTON
        - UPLOAD_TEST_ENABLED
        - CONSENT_ENABLED
        - TOKEN_REQUIRED
        - DUPLICATE_DONATION_CHECK_ENABLED
        - DUPLICATE_CHECK_CSV_DOWNLOAD_ENABLED
        - ENABLED_LANGUAGES
        - DEFAULT_LANGUAGE
        - BROWSER_LANGUAGE_ENABLED
        - ENABLED_DATA_SOURCES
        - DONOR_ID_INPUT_METHOD
        - DONOR_SURVEY_ENABLED
        - FEEDBACK_SURVEY_ENABLED
        - DONOR_SURVEY_LINK
        - FEEDBACK_SURVEY_LINK
        - NEXT_PUBLIC_MIN_CHATS_FOR_DONATION
        - NEXT_PUBLIC_MIN_MESSAGES_PER_CHAT
        - NEXT_PUBLIC_MIN_CONTACTS_PER_CHAT
        - NEXT_PUBLIC_MAX_FEEDBACK_CHATS
        - NEXT_PUBLIC_MIN_FEEDBACK_CHATS
        - NEXT_PUBLIC_DEFAULT_FEEDBACK_CHATS
        - NEXT_PUBLIC_MIN_MESSAGES_FOR_DUPLICATE_CHECK
    ports:
      - "9018:3000"
    environment:
      - DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
      - NODE_ENV=production
      - DEMO_MODE=$DEMO_MODE
      - PUBLIC_DATA_DONATION_ENABLED=$PUBLIC_DATA_DONATION_ENABLED
      - ENABLED_DATA_SOURCES=$ENABLED_DATA_SOURCES
      - DONOR_ID_INPUT_METHOD=$DONOR_ID_INPUT_METHOD
      - DONOR_SURVEY_ENABLED=$DONOR_SURVEY_ENABLED
      - FEEDBACK_SURVEY_ENABLED=$FEEDBACK_SURVEY_ENABLED
      - DONOR_SURVEY_LINK=$DONOR_SURVEY_LINK
      - FEEDBACK_SURVEY_LINK=$FEEDBACK_SURVEY_LINK
    env_file:
      - .env
    depends_on:
      - postgres
    entrypoint: ["sh", "-c", "pnpm drizzle-kit migrate && pnpm start"]

volumes:
  postgres-data:
